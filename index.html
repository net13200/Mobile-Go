<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="description" content="Play Go locally against a friend, and learn the game from the ground up.">
<title>Go</title>

<!-- Installable web app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

<!-- iOS home-screen app: Safari ignores the manifest for these, so they
     must be declared here or the app opens in a browser tab with a
     screenshot for an icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Go">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="setup-screen" class="screen active">
    <div class="setup-card">
      <h1>Go</h1>
      <p class="subtitle">Local two-player match</p>

      <div class="setup-group">
        <label>Board size</label>
        <div class="size-options">
          <button class="size-btn" data-size="9">
            <span class="size-num">9×9</span>
            <span class="size-tag">Quick</span>
          </button>
          <button class="size-btn" data-size="13">
            <span class="size-num">13×13</span>
            <span class="size-tag">Medium</span>
          </button>
          <button class="size-btn" data-size="19">
            <span class="size-num">19×19</span>
            <span class="size-tag">Standard</span>
          </button>
        </div>
      </div>

      <div class="setup-group">
        <label for="komi-input">Komi <span class="hint">(White's compensation)</span></label>
        <input type="number" id="komi-input" value="6.5" step="0.5" min="0" max="20" inputmode="decimal">
      </div>

      <button id="start-btn" class="primary-btn" disabled>Start Game</button>
      <button id="learn-btn" class="secondary-btn">Learn to Play</button>
    </div>
  </section>

  <section id="learn-screen" class="screen">
    <header class="sub-header">
      <button id="learn-back-btn" class="icon-btn" aria-label="Back">←</button>
      <h2>Learn to Play</h2>
    </header>
    <div id="lesson-list"></div>
  </section>

  <section id="lesson-screen" class="screen">
    <header class="sub-header">
      <button id="lesson-exit-btn" class="icon-btn" aria-label="Exit lesson">×</button>
      <div id="lesson-progress"></div>
    </header>
    <div id="lesson-board-wrap">
      <canvas id="lesson-canvas"></canvas>
    </div>
    <div id="lesson-text">
      <p id="lesson-caption"></p>
      <p id="lesson-feedback"></p>
    </div>
    <footer id="lesson-controls">
      <button id="lesson-menu-btn" class="ctrl-btn">Menu</button>
      <button id="lesson-back-step-btn" class="ctrl-btn hidden">Back</button>
      <button id="lesson-hint-btn" class="ctrl-btn hidden">Hint</button>
      <button id="lesson-retry-btn" class="ctrl-btn hidden">Retry</button>
      <button id="lesson-next-step-btn" class="primary-btn hidden">Next</button>
      <button id="lesson-continue-btn" class="primary-btn hidden">Next</button>
    </footer>
  </section>

  <section id="game-screen" class="screen">
    <header id="game-header">
      <button id="menu-btn" class="icon-btn" aria-label="New game">↺</button>
      <div id="turn-indicator">
        <span id="turn-stone" class="stone-icon black"></span>
        <span id="turn-text">Black to move</span>
      </div>
      <div id="captures-info">
        <span class="cap-row"><i class="dot black"></i><b id="captures-black">0</b></span>
        <span class="cap-row"><i class="dot white"></i><b id="captures-white">0</b></span>
      </div>
      <button id="score-toggle-btn" class="score-btn" aria-label="Toggle live score">Score</button>
    </header>

    <div id="live-score-panel" class="hidden">
      <div class="live-score">
        <div class="live-score-side">
          <i class="dot black"></i>
          <span id="live-score-black-panel">0</span>
          <small id="live-detail-black-panel"></small>
        </div>
        <div class="live-score-side">
          <i class="dot white"></i>
          <span id="live-score-white-panel">0</span>
          <small id="live-detail-white-panel"></small>
        </div>
      </div>
      <p class="estimate-note">Estimate — dead stones aren't marked until you pass twice.</p>
    </div>

    <div id="board-wrap">
      <canvas id="board-canvas"></canvas>
    </div>

    <div id="scoring-banner" class="hidden">
      <p>Tap groups to mark them dead. Score updates live.</p>
      <div class="live-score">
        <div class="live-score-side">
          <i class="dot black"></i>
          <span id="live-score-black">0</span>
          <small id="live-detail-black"></small>
        </div>
        <div class="live-score-side">
          <i class="dot white"></i>
          <span id="live-score-white">0</span>
          <small id="live-detail-white"></small>
        </div>
      </div>
      <div class="scoring-actions">
        <button id="resume-btn" class="ctrl-btn">Resume Play</button>
        <button id="finish-scoring-btn" class="primary-btn">Finish Scoring</button>
      </div>
    </div>

    <footer id="game-controls">
      <button id="undo-btn" class="ctrl-btn" disabled>Undo</button>
      <button id="pass-btn" class="ctrl-btn">Pass</button>
      <button id="resign-btn" class="ctrl-btn danger">Resign</button>
    </footer>
  </section>

  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="result-title"></h2>
      <p id="result-detail"></p>
      <div class="modal-actions">
        <button id="keep-reviewing-btn" class="ctrl-btn">Review Board</button>
        <button id="play-again-btn" class="primary-btn">New Game</button>
      </div>
    </div>
  </div>

</div>
<script src="js/go-engine.js"></script>
<script src="js/board-view.js"></script>
<script src="js/app.js"></script>
<script src="js/tutorial-helpers.js"></script>
<script src="js/tutorial-content.js"></script>
<script src="js/tutorial.js"></script>
<script>
  // Offline support. Needs a secure origin, so it's skipped on file:// —
  // the app still runs, just without offline caching.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
    });
  }
</script>
</body>
</html>
